version: 2

# Two dependency tracks are kept apart on purpose:
#   - gomod: compiled into the binary. Tracked here.
#   - Hugo: a RUNTIME dependency (crofty shells out to it), not a module, so
#     Dependabot cannot see it. Its compatibility lives in
#     .github/workflows/hugo-compat.yml instead.
#
# Distribution stays decoupled from merging: bumps merge into main behind the CI
# gate and ride the next *intentional* wharfy release. Nothing here auto-distributes.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      # Every gomod dependency, patch+minor, in one PR — auto-merged behind the
      # CI gate (dependabot-auto-merge.yml).
      #
      # There used to be a narrower `low-risk` group here that held the
      # credential / network / crypto deps back for a human to read one by one.
      # With a single maintainer that reading did not happen: a jlaffaye/ftp
      # patch sat for a month while CI had gone green seven minutes after the PR
      # opened. A gate nobody passes through is not review, it is rot (D-404).
      #
      # What keeps this safe is the *distribution* gate, not the merge gate:
      # promote.yml is manual dispatch only, so a bump that lands here reaches
      # no user until a release is made on purpose. Majors are still read by
      # hand — groups carry patch+minor only, so each major arrives as its own
      # PR, ungrouped.
      go-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions pinned in the workflows above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"
